{% load static %}
<a href="{{ product.get_absolute_url }}" class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
    <div class="aspect-square bg-orange-100 flex items-center justify-center overflow-hidden">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-full object-cover">
        {% else %}
        <span class="text-4xl">🧸</span>
        {% endif %}
    </div>
    <div class="p-3 flex-1 flex flex-col">
        <span class="text-xs text-pink-500 font-semibold uppercase">{{ product.category.name }}</span>
        <span class="font-semibold text-sm mt-1 flex-1">{{ product.name }}</span>
        <span class="font-bold mt-2">₹{{ product.price }}</span>
    </div>
</a>
